# Isolated member test database only. Always pass a unique Compose project name.
services:
  arangodb:
    image: arangodb:3.12.11
    environment:
      ARANGO_ROOT_PASSWORD: ${ARANGO_ROOT_PASSWORD:?Set it in the ignored secret env file}
    ports:
      - "127.0.0.1:${ARANGO_TEST_PORT:?Set a loopback port in the ignored secret env file}:8529"
    volumes:
      - arangodb-data:/var/lib/arangodb3
volumes:
  arangodb-data: